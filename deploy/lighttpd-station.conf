# /etc/lighttpd/conf-available/89-wsm-station.conf
# The station landing page served by lighttpd (the ADS-B web server) while WSM is switched off.
# Files: written by  python3 tools/wsm_landing_snapshot.py  into /var/www/station.
# Enable:   sudo cp deploy/lighttpd-station.conf /etc/lighttpd/conf-available/89-wsm-station.conf
#           (put the host name in the line with example\.org), then  sudo lighty-enable-mod wsm-station && sudo systemctl reload lighttpd
# Disable:  sudo lighty-disable-mod wsm-station && sudo systemctl reload lighttpd
# Only requests for the station host name get it; the tar1090 / graphs1090 aliases keep working there, and every
# other host name (the LAN address, fsm.…) still gets the normal lighttpd pages.
# Replace example\.org with the host name of the landing page (the dots escaped), as in wsm.yaml landing.hosts.
$HTTP["host"] =~ "^(www\.)?example\.org(:[0-9]+)?$" {
    server.document-root = "/var/www/station"
    index-file.names = ( "station.html" )
    # tar1090 setups often redirect "/" to "/tar1090/" for every host name: here "/" is the station page
    url.redirect = ( "^/tar1090$" => "/tar1090/" )
}
